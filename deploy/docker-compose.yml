# Stack de producción de SAIDSOFT: panel web + worker MQTT + TimescaleDB + EMQX.
# Copiar deploy/.env.prod.example a deploy/.env y completar antes de levantar.
#   docker-compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# El panel va detrás de un proxy TLS (servicio `nginx`, 22-ago-2026 — ver
# PLAN_MODERNIZACION.md §10-Y/SEC-2) que termina HTTPS con un certificado autofirmado;
# `web` (gunicorn) ya no publica puerto al host, solo se lo ve dentro de la red de
# Docker. EMQX termina su propio TLS en 8883 (los agentes hablan MQTT sobre TLS
# directamente contra EMQX, sin pasar por nginx).

x-app: &app-build
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init-timescaledb.sql:/docker-entrypoint-initdb.d/10-timescaledb.sql:ro
    ports:
      - "127.0.0.1:5433:5432"   # acceso local con pgAdmin (5432 del host lo usa otro Postgres)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.3
    restart: unless-stopped
    # Sin esto, el contenedor arranca con una identidad interna nueva cada vez que se
    # recrea (`docker-compose down` + `up`, o un rebuild) — el nodo Erlang de EMQX
    # (y con él, la base Mnesia de built_in_database: usuarios/ACLs que siembra
    # bootstrap-emqx.sh) queda atado a ese hostname, así que un hostname que cambia
    # hace que EMQX arranque "en blanco" aunque el volumen emqx_data siga intacto —
    # confirmado en producción (20-ago-2026): dos recreaciones seguidas del
    # contenedor dejaron al worker/agente en loop de "Not authorized" hasta volver a
    # correr bootstrap-emqx.sh cada vez. Un hostname fijo le da continuidad al nodo
    # entre recreaciones.
    hostname: emqx
    environment:
      EMQX_NODE__COOKIE: ${EMQX_COOKIE}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      # Autenticación built-in (mnesia) activada; los usuarios se siembran con bootstrap-emqx.sh
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__ENABLE: "true"
      # Autorización: declarar built_in_database como fuente reemplaza la fuente por
      # defecto de EMQX (un archivo cuya última regla es `{allow, all}` — confirmado
      # probando contra una instancia real; con esa fuente presente, no_match=deny no
      # alcanza, porque SIEMPRE hay una regla que matchea antes de llegar a no_match).
      # bootstrap-emqx.sh siembra las reglas por usuario en esta fuente.
      EMQX_AUTHORIZATION__SOURCES__1__TYPE: built_in_database
      EMQX_AUTHORIZATION__SOURCES__1__ENABLE: "true"
      # Deniega lo que no tenga una regla explícita en built_in_database.
      EMQX_AUTHORIZATION__NO_MATCH: "deny"
      # Listener MQTT sobre TLS (8883) usando los certs montados en ./certs
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/certs/cert.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/certs/key.pem
      # Desactiva el listener TCP sin cifrar: los agentes deben hablar solo por TLS.
      EMQX_LISTENERS__TCP__DEFAULT__ENABLE: "false"
      # wss:default (websocket-TLS, 8084) viene habilitado por defecto en la imagen y no
      # lo usa este proyecto — pero igual exige cert/key en la misma ruta montada por
      # ./certs, y si el volumen está vacío (certs no generados aún) su fallo tumba TODO
      # el nodo EMQX, no solo ese listener (visto en producción: crash loop completo por
      # "no_cert" en wss mientras ssl:8883/ws:8083 sí arrancaban). Desactivarlo explícito.
      EMQX_LISTENERS__WSS__DEFAULT__ENABLE: "false"
    volumes:
      - emqx_data:/opt/emqx/data
      - ./certs:/opt/emqx/etc/certs:ro          # cert.pem / key.pem para el listener TLS
    ports:
      - "8081:8883"    # MQTT sobre TLS (agentes) — remapeado a 8081 (rango 8080-8085 abierto en firewall)
      - "8082:18083"   # dashboard (restringir por firewall/VPN)

  web:
    <<: *app-build
    restart: unless-stopped
    # --timeout 600 (no 120): subir el .zip de un despliegue desde una farmacia entra
    # por la VPN (~50-126ms RTT, MSS 1394) y 32MB pueden tardar varios minutos; con
    # 120s gunicorn mataba al worker a mitad de la subida sin error visible para el
    # operador (diagnosticado con tcpdump contra el piloto real, 6-ago-2026).
    # --access-logfile -: sin access log, ese mismo diagnóstico fue a ciegas — los
    # requests que llegan (o no) tienen que verse en `docker-compose logs web`.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "600", "--access-logfile", "-"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      RUN_MIGRATIONS: "1"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ARCHIVOS_BASE_URL: ${ARCHIVOS_BASE_URL}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      COOKIES_SOLO_HTTPS: ${COOKIES_SOLO_HTTPS:-True}
      MQTT_HOST: emqx
      MQTT_PORT: "8883"
      MQTT_USERNAME: ${MQTT_USERNAME_PANEL}
      MQTT_PASSWORD: ${MQTT_PASSWORD_PANEL}
      MQTT_USE_TLS: "True"
      MQTT_CA_CERT: /app/deploy/certs/cert.pem
      # Sin default: ambas son settings requeridas (sin ellas Django no arranca). Antes
      # faltaban aquí — el stack tal como estaba no podía levantar `web`/`worker` en limpio.
      COMANDO_HMAC_SECRET: ${COMANDO_HMAC_SECRET}
      BITLOCKER_ENCRYPTION_KEY: ${BITLOCKER_ENCRYPTION_KEY}
      # Acceso remoto (MeshCentral) — opcional, ver servicio `meshcentral` más abajo.
      # Vacío por defecto: sin MESHCENTRAL_MESH_ID el botón de "instalar agente" y los
      # links de escritorio/terminal remotos no funcionan, pero el resto del panel sí.
      # Mismos defaults que MESHCENTRAL_CONFIG en base.py — si deploy/.env no las define,
      # docker compose igual pasaría "" al contenedor (no "ausente"), y env('X', default=Y)
      # de django-environ NO aplica default a una var que SÍ existe pero está vacía. Sin
      # este ":-<default>" acá, un .env incompleto rompería el default en silencio (a
      # diferencia de COMANDO_HMAC_SECRET, que si falta hace tronar el arranque, esto no
      # truena, solo genera links rotos). Solo las necesita `web`, no `worker`.
      MESHCENTRAL_SERVER_URL: ${MESHCENTRAL_SERVER_URL:-https://localhost:443}
      MESHCENTRAL_MESH_ID: ${MESHCENTRAL_MESH_ID:-}
      MESHCENTRAL_AGENT_ARCH_ID: ${MESHCENTRAL_AGENT_ARCH_ID:-4}
      MESHCENTRAL_INSTALL_FLAGS: ${MESHCENTRAL_INSTALL_FLAGS:-2}
      MESHCENTRAL_VIEWMODE_ESCRITORIO: ${MESHCENTRAL_VIEWMODE_ESCRITORIO:-11}
      MESHCENTRAL_VIEWMODE_TERMINAL: ${MESHCENTRAL_VIEWMODE_TERMINAL:-12}
      # Fundación async (Fase 1 del roadmap) — sin esto, Django usa el default
      # (redis://localhost:6379/0, no existe acá) y cualquier llamada a una tarea Celery
      # colgaría intentando conectar a un Redis que no está.
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_started
      redis:
        condition: service_started
    # Sin publicar puerto al host (22-ago-2026, SEC-2): antes exponía 8080 sin cifrar
    # directo desde gunicorn — ahora el único punto de entrada es `nginx` (TLS), que lo
    # alcanza por red interna de Docker vía "web:8000".
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - media_data:/app/media:ro   # sirve /media/ directo (descargas de agentes, sin auth)
    depends_on:
      - web
    ports:
      - "8080:80"    # HTTP: solo /media/ (agentes) sin redirect; todo lo demás -> HTTPS
      - "8084:443"   # HTTPS: dentro del rango 8080-8085 ya abierto en firewall

  worker:
    <<: *app-build
    restart: unless-stopped
    command: ["python", "manage.py", "run_mqtt_worker"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      MQTT_HOST: emqx
      MQTT_PORT: "8883"
      MQTT_USERNAME: ${MQTT_USERNAME_WORKER}
      MQTT_PASSWORD: ${MQTT_PASSWORD_WORKER}
      MQTT_USE_TLS: "True"
      MQTT_CA_CERT: /app/deploy/certs/cert.pem
      COMANDO_HMAC_SECRET: ${COMANDO_HMAC_SECRET}
      BITLOCKER_ENCRYPTION_KEY: ${BITLOCKER_ENCRYPTION_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media   # el worker lee los paquetes que sirve el web
    depends_on:
      db:
        condition: service_healthy
      emqx:
        condition: service_started
      redis:
        condition: service_started

  meshcentral_worker:
    <<: *app-build
    restart: unless-stopped
    # Escucha el canal de control de MeshCentral (control.ashx) para el cruce
    # MQTT×MeshCentral — ver apps.monitoreo.adapters.meshcentral y
    # PLAN_MODERNIZACION.md §9/§10. Si MESHCENTRAL_API_* no está configurado, el comando
    # se queda quieto (log de aviso) sin tumbar el servicio ni el resto del stack.
    command: ["python", "manage.py", "run_meshcentral_worker"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      COMANDO_HMAC_SECRET: ${COMANDO_HMAC_SECRET}
      BITLOCKER_ENCRYPTION_KEY: ${BITLOCKER_ENCRYPTION_KEY}
      MESHCENTRAL_API_WS_URL: ${MESHCENTRAL_API_WS_URL}
      MESHCENTRAL_API_USUARIO: ${MESHCENTRAL_API_USUARIO}
      MESHCENTRAL_API_PASSWORD: ${MESHCENTRAL_API_PASSWORD}
      MESHCENTRAL_API_CA_CERT: ${MESHCENTRAL_API_CA_CERT}
      MESHCENTRAL_API_VERIFICAR_TLS: ${MESHCENTRAL_API_VERIFICAR_TLS:-True}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      meshcentral:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]   # snapshot cada 60s si hubo escrituras — alcanza para colas/beat, no es un dato crítico de negocio
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery_worker:
    <<: *app-build
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      COMANDO_HMAC_SECRET: ${COMANDO_HMAC_SECRET}
      BITLOCKER_ENCRYPTION_KEY: ${BITLOCKER_ENCRYPTION_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    <<: *app-build
    restart: unless-stopped
    # Reemplaza el cron externo que documentaba README-produccion.md para las 4 tareas
    # periódicas (marcar_estaciones_offline, purgar_metricas, generar_ejecuciones/
    # mantenimientos_programados) — ver CELERY_BEAT_SCHEDULE en config/settings/base.py.
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.produccion
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      COMANDO_HMAC_SECRET: ${COMANDO_HMAC_SECRET}
      BITLOCKER_ENCRYPTION_KEY: ${BITLOCKER_ENCRYPTION_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Acceso remoto interactivo (ver README.md "Acceso remoto (MeshCentral)"). Bolt-on
  # completamente separado del canal MQTT/HMAC: web/worker no lo llaman por red, solo
  # arman URLs (MESHCENTRAL_SERVER_URL de arriba) que se abren en el navegador del panel.
  # NO validado end-to-end en este repo todavía (falta correrlo contra una estación real
  # y confirmar los MESHCENTRAL_VIEWMODE_* contra la consola) — ver deploy/README-produccion.md.
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # NeDB (archivo) alcanza para el piloto; a partir de ~50 estaciones vinculadas,
      # sumar un servicio mongo y USE_MONGODB/MONGO_URL (no incluido: fuera de alcance
      # de este stack hasta que el piloto de MeshCentral esté validado).
    volumes:
      - meshcentral_data:/opt/meshcentral/meshcentral-data
      - meshcentral_files:/opt/meshcentral/meshcentral-files
      # config.json real (gitignored, copiar desde config.json.example — ver
      # deploy/README-produccion.md). No usamos HOSTNAME/ALLOW_NEW_ACCOUNTS por env var
      # a propósito: el propio entrypoint de la imagen solo los lee la primerísima vez
      # que NO existe un config.json ("Pre-existing config found, not recreating..." en
      # cualquier arranque siguiente) — con este bind mount, config.json SIEMPRE
      # preexiste desde el primer arranque, así que esas env vars nunca se leerían y
      # solo generarían confusión. Todo se edita acá.
      - ./meshcentral/config.json:/opt/meshcentral/meshcentral-data/config.json:ro
    ports:
      - "8083:443"   # remapeado a 8083 (rango 8080-8085 abierto en firewall); detrás de proxy TLS en prod real
      # config.json.example ya trae aliasPort:8083 para que coincida con este remapeo —
      # sin eso, MeshCentral genera los links de instalación de agente con el puerto
      # interno (443) en vez del externo real, y ningún agente logra conectarse aunque
      # el instalador corra sin error (encontrado en el primer piloto real, 6-ago-2026).

volumes:
  db_data:
  media_data:
  emqx_data:
  meshcentral_data:
  meshcentral_files:
  redis_data:
