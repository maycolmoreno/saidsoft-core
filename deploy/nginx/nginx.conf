# Proxy TLS delante del panel (SEC-2 de la auditoría de gobernanza, 22-ago-2026):
# gunicorn (servicio `web`) ya no publica su puerto directo al host — solo lo ve este
# contenedor dentro de la red de Docker (`web:8000`). Certificado autofirmado
# compartido con EMQX (../certs/cert.pem, ya tiene la IP real del servidor en el SAN,
# ver ../certs/generar-certs-dev.sh) — no hay dominio público, ver PLAN_MODERNIZACION.md
# §10-Y/SEC-2.

server {
    listen 80;
    server_name _;

    # Los ~1.935 agentes descargan paquetes de despliegue/instaladores de acá SIN
    # autenticación (ver config/urls.py — a propósito, no hay credenciales ni cookie
    # de sesión en este path) usando `urllib` sin confiar en el certificado
    # autofirmado del panel. Redirigir esto a HTTPS rompería todas las descargas de
    # la flota real. De paso resuelve la deuda de performance que config/urls.py ya
    # señalaba: antes cada descarga ocupaba un worker de gunicorn; acá nginx sirve el
    # archivo directo del volumen.
    location /media/ {
        alias /app/media/;
    }

    # Todo lo demás sí protege credenciales/cookies de sesión -> fuerza HTTPS.
    location / {
        # $host no incluye el puerto del Host: del cliente (nginx lo separa en
        # $http_host) — seguro reconstruir la URL agregando el puerto HTTPS a mano.
        return 301 https://$host:8084$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Los despliegues suben un .zip de hasta 32MB (ver DespliegueForm) — margen igual
    # que el resto del stack.
    client_max_body_size 64m;

    location /media/ {
        alias /app/media/;
    }

    # DNS embebido de Docker. Sin esto, nginx resuelve "web" UNA sola vez al arrancar y
    # se queda con esa IP para siempre: cada vez que se recrea el contenedor `web` en un
    # despliegue, toma una IP nueva y nginx sigue yendo a la vieja -- 502 Bad Gateway
    # hasta reiniciar nginx a mano (pasó dos veces el 4-sep-2026).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        # El nombre va en una variable A PROPÓSITO: con un literal, nginx resuelve en el
        # arranque y el `resolver` de arriba no se usa nunca. Con variable, re-resuelve
        # según `valid=`, así que un contenedor recreado se toma solo en ~10s.
        # Sin URI al final, nginx pasa el request URI original tal cual lo mandó el cliente.
        set $upstream_web web;
        proxy_pass http://$upstream_web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django confía en esta cabecera vía SECURE_PROXY_SSL_HEADER
        # (config/settings/produccion.py) para saber que la conexión real es HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        # Mismo timeout que gunicorn --timeout 600 en el servicio `web` (subir un .zip
        # de despliegue desde una farmacia por VPN puede tardar varios minutos).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
