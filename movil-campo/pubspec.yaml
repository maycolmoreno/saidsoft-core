name: cresio_campo
description: App de tecnicos en campo de SAIDSOFT (CRESIO).
publish_to: none
version: 1.8.1+11

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  # Token de sesion en el almacen cifrado del sistema, nunca en SharedPreferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  # Cola offline: las farmacias tienen enlaces intermitentes y el tecnico no puede
  # perder el cierre de un mantenimiento por quedarse sin senal.
  sqflite: ^2.3.3+1
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  signature: ^5.5.0
  permission_handler: ^11.3.1
  # Cerradura biometrica sobre la sesion guardada (ver rasgos/sesion/bloqueo_biometrico.dart).
  # No autentica contra el servidor: solo desbloquea el token que ya esta en el almacen
  # cifrado, para que un celular en manos ajenas no sea una sesion de tecnico abierta.
  local_auth: ^2.3.0
  intl: ^0.19.0
  # Para estampar la ubicacion en la foto (ver nucleo/imagen/marca_agua.dart).
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    # Certificado propio del servidor: la app confia SOLO en este, sin desactivar
    # la validacion TLS. Ver lib/nucleo/red/http_seguro.dart.
    - assets/certs/cert.pem
