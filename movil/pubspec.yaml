name: cresio_mobile
description: Aplicacion movil interna CRESIO para tecnicos de soporte.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  signature: ^5.5.0
  connectivity_plus: ^6.0.5
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  geolocator: ^13.0.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    # Certificado propio del servidor SAIDSOFT: la app confía SOLO en este, en vez
    # de desactivar la validación TLS. Ver lib/core/network/http_seguro.dart.
    - assets/certs/cert.pem
    - assets/icon/
